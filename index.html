		async function getInferenceSession()

			if (!sessionPromise)

				sessionPromise = await ort.InferenceSession.create("model.onnx", {

				});
			}
			return sessionPromise;
		}
		
		class ResponseContext
		{
			constructor(content)
			{
				this._content = content;
			}

			async update(text)
			{
				this._content.innerHTML = "<p>" + text + "</p>";
			}
		}
