	<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.6.0/dist/tf.min.js"></script>

<body>

    <div class="container">
        <h1>Ask Greg Anything</h1> 
		<textarea id="comment" name="comment" rows="4" cols="50" placeholder=""></textarea>
        <p></p>

        <button onclick="changeContent()">Ask</button>

        <div class="content" id="dynamicContent">
            <p></p>
        </div>
    </div>

    <script>
		let sessionPromise = null;

		window.addEventListener('load', () => { getInferenceSession(); });

		async function getInferenceSession()
		{
			if (!sessionPromise)
			{
				sessionPromise = await ort.InferenceSession.create("model.onnx", {
					executionProviders: ["webgl", "wasm"],
				});
			}
			return sessionPromise;
		}
		
		async function infer(text, vocabulary, session)
		{
		 	function argmax(_tensor, _sequenceIndex)
			{
				const dims = _tensor.dims;
				const batchIndex = dims[0]
				const sequenceLength = dims[1];
				const vocabularySize = dims[2];

				var maxIndex = 0;
				var maxVal = Number.MIN_VALUE;
				for(let v = 0; v < vocabularySize; v++)
				{
					const sample = data[_sequenceIndex * vocabularySize + v];
					if(sample > maxVal)
					{
						maxVal = sample;
						maxIndex = v;
					}
				}
				return maxIndex;
			}
			const maxGenSize = 2048;
			const startToken = startSequenceCharacter;
			const endToken = endSequenceCharacter;
			const nullToken = nullCharacter;

			const inputTokenName = session.inputNames[0]
			const inputMaskName = session.inputNames[1]
			const outputName = session.outputNames[0]

			const maxSequenceLength = session.inputMetadata[0].shape[1]
			let inputTokens = [startToken, ...tokenizerEncode(vocabulary, text)];

			while (len(tokens) < maxGenSize)
			{
				let tokenInputs = inputTokens;
				tokenInputs = tokenInputs.slice(0, maxSequenceLength);
				while (inputTokens.legth < maxSequenceLength)
					inputTokens.push(nullToken);
				output_index = tokens.length - 1

				const mask = inputTokens.map(t => t == null ? 0 : 1);

				const inputTensor = new ort.Tensor('int32', Int32Array.from(inputTokens), [1, inputTokens.length]);
				const inputMask = new ort.Tensor('int32', Int32Array.from(mask), [1, mask.length]);

				var feeds = {};
				feeds[inputTokenName] = inputTensor;
				feeds[inputMaskName] = inputMask;

				const results = await session.run(feeds);
				const output = results[session.outputNames[0]];

				genToken = argmax(output, output_index);
				if (genToken == endToken)
					break;

				tokens.push(genToken);
			}

			tokens = tokens.slice(1, tokens.length-1);
			return tokenizerDecode(vocabulary, tokens)
		}
		
        async function changeContent()
		{
			var vocab = await createVocabulary();
			var session = await getInferenceSession();
			const input = document.getElementById("comment").value;
			const tokens = tokenizerEncode(vocab, input)
			
			const response = await infer(input, vocab, session);
			
			document.getElementById("dynamicContent").innerHTML = "<p>" + response + "</p>";
        }
    </script>

</body>
